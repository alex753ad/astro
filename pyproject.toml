[project]
name = "astro-spa"
version = "0.1.0"
description = "Astrological web application — natal chart, transits, AI interpretations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pyswisseph>=2.10.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "slowapi>=0.1.9",
    # >=3.4.0, не 3.3.0: в 3.3.0 живут CVE-2024-33663 (algorithm confusion —
    # подпись проверяется не тем алгоритмом, каким выдана) и CVE-2024-33664
    # (DoS «JWE-бомбой»). На этой библиотеке держится вся аутентификация,
    # поэтому диапазон, допускающий уязвимую версию, здесь недопустим.
    "python-jose[cryptography]>=3.4.0",
    # bcrypt вызывается напрямую (backend/auth/passwords.py), passlib убран
    # 22.09.2026: он мёртв с 2020 и держал границу <5.0.0 — его самопроверка
    # detect_wrap_bug хеширует секрет в 255 байт, а bcrypt 5.x на секрете
    # длиннее 72 байт кидает ValueError вместо молчаливого усечения, и
    # падал первый же verify_password у всех, включая короткие пароли.
    # Без passlib этого нет: обрезку до 72 байт делаем сами, в hash и в
    # verify (см. докстринг _secret — удалять её нельзя).
    # <6.0.0 — мажор не пускаем без проверки: формат хеша и поведение на
    # границе 72 байт у этой библиотеки уже менялись мажором.
    "bcrypt>=5.0.0,<6.0.0",
    "timezonefinder>=6.5.0",
    "pytz>=2024.1",
    "geopy>=2.4.1",
    "redis>=5.0.0",
    # celery_app.py и tasks.py используют его целиком (worker + beat), но
    # пакет не был объявлен зависимостью вовсе — .delay()/.apply_async()
    # клали задачу в Redis, откуда её никто не забирал: рассылка из CRM,
    # PDF, лунные возвращения, ретеншен-письма молча не работали.
    "celery>=5.4.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.20.0",
    "Pillow>=10.3.0",
    "reportlab>=4.0.0",
    "pywebpush>=1.14.0",
    # Только подпись JWT сервис-аккаунта и обмен его на access-token для
    # FCM HTTP v1 (backend/push/fcm.py). Намеренно не firebase-admin: тот
    # тянет половину google-cloud ради одного POST.
    "google-auth>=2.30.0",
    "python-multipart>=0.0.9",
    "aiogram>=3.4",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.20.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["mnt*", "data*", "frontend*", "alembic*", "routers*"]
