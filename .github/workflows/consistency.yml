name: Consistency

# Прогон согласованности разделов (scripts/consistency_eval.py): одна дата и
# одна карта — совпадают ли события, даты и тон в ленте, прогнозе, планере,
# чате, пушах и виджете. Шаг 1 плана docs/audit_unified_model.md. Без модели —
# прогон бесплатный, только ручной запуск.
#
# Расхождения — результат, а не сбой: job зелёный при любом их числе и
# краснеет, если проверка упала с исключением (отчёт при этом уходит) или не
# ушёл отчёт.
#
# ⚠️ Репозиторий ПУБЛИЧНЫЙ: отчёт (даты и события по карте живого человека)
# уходит только файлом владельцу в Telegram, в лог — одни счётчики. Не
# добавлять сюда upload-artifact и `cat` отчёта.
#
# Секреты: CHAT_EVAL_BIRTH (JSON {"date","time","place"}), TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID (личный чат владельца, как у notify.py).

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Первый день YYYY-MM-DD (пусто — сегодня по Москве). Для «было | стало» — один и тот же"
        required: false
        default: ""
      days:
        description: "Сколько дней (фазы и станции — всегда не меньше 31)"
        required: false
        default: "7"
      tzs:
        description: "Пояса устройства через запятую"
        required: false
        default: "Europe/Moscow,Asia/Vladivostok,America/New_York"
      tier:
        description: "Тариф (замки планера и горизонт ленты)"
        type: choice
        options: [free, lite, pro, premium]
        default: premium
      compare_ref:
        description: "«Было»: ПОЛНЫЙ SHA или ветка, где уже есть scripts/consistency_eval.py. Пусто — без сравнения"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHAT_EVAL_BIRTH: ${{ secrets.CHAT_EVAL_BIRTH }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      EPHE_PATH: data/ephe
      JWT_SECRET: consistency-only-not-a-real-secret-0123456789abcdef
      # c5 берёт фазы лунного календаря из backend.main (_compute_lunar_calendar),
      # а импорт main без TESTING требует боевых секретов (INTERNAL_SECRET,
      # ЮKassa) и падает RuntimeError — так упал первый прогон 37128122948.
      # Прогон считает эфемериды и ничего не пишет, боевое окружение ему не нужно.
      TESTING: "true"
      # Входы — через env, а не подстановкой ${{ }} в run (см. chat-eval.yml).
      IN_DATE: ${{ inputs.date }}
      IN_DAYS: ${{ inputs.days }}
      IN_TZS: ${{ inputs.tzs }}
      IN_TIER: ${{ inputs.tier }}
      IN_REF: ${{ inputs.compare_ref }}

    steps:
      - name: Секреты на месте
        run: |
          for v in CHAT_EVAL_BIRTH TG_TOKEN TG_CHAT; do
            [ -n "${!v}" ] || { echo "::error::Нет секрета для $v"; exit 1; }
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: inputs.compare_ref != ''
        with:
          ref: ${{ inputs.compare_ref }}
          path: base

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # Без `pip install -e .` — по той же причине, что в chat-eval.yml.
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.lock

      - name: Дата
        run: echo "DATE=${IN_DATE:-$(TZ=Europe/Moscow date +%F)}" >> "$GITHUB_ENV"

      # Ненулевой код скрипта — упавшая проверка (или весь прогон). Шаг не
      # обрывает job: отчёт с её ошибкой уходит владельцу, а краснеет job в
      # последнем шаге. Расхождения код не меняют — при них job зелёный.
      - name: Стало
        run: |
          set +e
          python scripts/consistency_eval.py run --date "$DATE" --days "$IN_DAYS" --tzs "$IN_TZS" --tier "$IN_TIER" --out "$RUNNER_TEMP/cur.json"
          echo "CUR_RC=$?" >> "$GITHUB_ENV"

      # Под флагом sky_event (задание 4.2): тот же код, разделы — из ядра
      # backend/sky.py. В отчёте — столбец «Под флагом» и отличие от «стало».
      - name: Под флагом
        run: |
          set +e
          python scripts/consistency_eval.py run --sky on --date "$DATE" --days "$IN_DAYS" --tzs "$IN_TZS" --tier "$IN_TIER" --out "$RUNNER_TEMP/sky.json"
          echo "SKY_RC=$?" >> "$GITHUB_ENV"

      - name: Было
        if: inputs.compare_ref != ''
        working-directory: base
        run: |
          set +e
          python scripts/consistency_eval.py run --date "$DATE" --days "$IN_DAYS" --tzs "$IN_TZS" --tier "$IN_TIER" --out "$RUNNER_TEMP/base.json"
          echo "BASE_RC=$?" >> "$GITHUB_ENV"

      # «Утро: было / стало» (шаг 5, решение владельца 05.10.2026): в скрипте
      # базы подкоманды morning нет — она идёт ЭТИМ скриптом на коде базы
      # (EVAL_ROOT). Не проверка: сбой шага отчёт не роняет, раздел просто
      # выйдет без «было».
      - name: Утро (было)
        if: inputs.compare_ref != ''
        continue-on-error: true
        run: |
          EVAL_ROOT="$GITHUB_WORKSPACE/base" python scripts/consistency_eval.py morning --date "$DATE" --days "$IN_DAYS" --tzs "$IN_TZS" --out "$RUNNER_TEMP/base_morning.json"

      - name: Отчёт в Telegram
        run: |
          api="https://api.telegram.org/bot$TG_TOKEN"
          if [ ! -f "$RUNNER_TEMP/cur.json" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' -d chat_id="$TG_CHAT"               --data-urlencode text="⚠️ Прогон согласованности $GITHUB_RUN_ID упал целиком, отчёта нет — см. лог"               "$api/sendMessage")
            [ "$code" = "200" ] || echo "::error::Telegram ответил $code"
            exit 0
          fi
          files="$RUNNER_TEMP/cur.json"
          [ -f "$RUNNER_TEMP/base.json" ] && files="$files $RUNNER_TEMP/base.json"
          out="$RUNNER_TEMP/consistency-$DATE-run$GITHUB_RUN_ID.md"
          python scripts/consistency_eval.py report $files --base-morning "$RUNNER_TEMP/base_morning.json" --sky-file "$RUNNER_TEMP/sky.json" --out "$out"
          # Первая строка отчёта — какие проверки не выполнились (или «все»).
          code=$(curl -sS -o /dev/null -w '%{http_code}'             -F chat_id="$TG_CHAT" -F document=@"$out"             -F caption="$(head -n1 "$out") Прогон согласованности, $DATE, прогон $GITHUB_RUN_ID"             "$api/sendDocument")
          [ "$code" = "200" ] || { echo "::error::Telegram ответил $code"; exit 1; }

      - name: Ошибка прогона
        run: |
          [ "${CUR_RC:-1}" = "0" ] || { echo "::error::Прогон «стало» не выполнил проверки (код $CUR_RC)"; exit 1; }
          [ "${BASE_RC:-0}" = "0" ] || { echo "::error::Прогон «было» не выполнил проверки (код $BASE_RC)"; exit 1; }
          [ "${SKY_RC:-0}" = "0" ] || { echo "::error::Прогон «под флагом» не выполнил проверки (код $SKY_RC)"; exit 1; }
