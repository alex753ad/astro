name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ручной запуск — единственный способ выкатить прод, см. job deploy ниже.
  workflow_dispatch:

# По умолчанию GITHUB_TOKEN получает права из настроек репозитория — вплоть до
# write-all. Здесь он нужен только на чтение кода; джобы, которым нужно больше,
# расширяют права у себя (см. security → gitleaks).
permissions:
  contents: read

# Новый push в ту же ветку отменяет предыдущий прогон. Деплой не отменяем:
# оборванный на середине деплой хуже лишней минуты ожидания.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Все actions запинены на SHA коммита, а не на плавающий тег.
# Тег вида @v1 владелец репозитория (или тот, кто угонит к нему доступ) может
# передвинуть на произвольный код — а этот код выполнится с приватным
# SSH-ключом от прод-сервера в secrets.SSH_PRIVATE_KEY. SHA передвинуть нельзя.
# Обновления доверены Dependabot (.github/dependabot.yml), он поднимает SHA
# отдельным PR и пишет новую версию в комментарий.

jobs:
  # ─────────────────────────────────────────────
  # 1. Backend tests
  # ─────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: astro
          POSTGRES_DB: astro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astro -d astro_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://astro:astro@localhost:5432/astro_test
      REDIS_URL: redis://localhost:6379/0
      # Длина >= 32: приложение отказывается стартовать с коротким секретом
      # вне DEBUG/TESTING.
      JWT_SECRET: ci-only-secret-do-not-use-anywhere-else-0123456789
      TESTING: "true"
      EPHE_PATH: data/ephe
      OPENAI_API_KEY: ""

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      # Из лока, а не из диапазонов pyproject: тесты обязаны гонять ровно те
      # версии, которые поедут в прод-образ.
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements-dev.lock
          pip install --no-cache-dir --no-deps -e .

      - name: Run unit tests
        run: pytest backend/tests/ -v -m "not integration and not load" --tb=short --ignore=backend/tests/test_payments.py

  # ─────────────────────────────────────────────
  # 2. Статический анализ и уязвимости
  # ─────────────────────────────────────────────
  # Отдельная джоба, а не шаги внутри тестов: она не зависит от сервисов и
  # отрабатывает за минуту, давая быструю обратную связь на PR.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action на событии pull_request читает список коммитов PR через
      # GET /repos/{owner}/{repo}/pulls/{n}/commits — без этого права запрос
      # возвращает 403 «Resource not accessible by integration» и джоба падает.
      # На push и workflow_dispatch не требуется (там сканируется диапазон
      # коммитов или вся история), поэтому дефект не всплывал: PR в проекте
      # почти не используются, работа идёт пушами в main.
      pull-requests: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # gitleaks сравнивает диапазон коммитов — с shallow-клоном ему нечего
          # смотреть, кроме последнего.
          fetch-depth: 0

      # ── Секреты в истории ──────────────────────────────────────────────────
      # Блокирующий шаг. Именно этого шага не хватало, чтобы заметить рабочий
      # OPENAI_API_KEY и JWT_SECRET, закоммиченные в .env.example.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Отдельная дешёвая проверка ровно того случая, который уже случился:
      # в .env.example должны быть имена переменных и плейсхолдеры, а не значения.
      - name: .env.example не содержит значений
        run: |
          # Смотрим только на ключи, которые по имени обязаны быть секретом, и
          # только на длинные значения. DATABASE_URL и ALLOWED_ORIGINS тоже
          # длинные, но это не секреты, а образцы формата.
          # Плейсхолдеры вида sk-..., <generate-me>, re_... — допустимы.
          bad=$(grep -rnE '^[A-Z0-9_]*(SECRET|TOKEN|PASSWORD|API_KEY|PRIVATE_KEY)[A-Z0-9_]*=[^[:space:]]{25,}' \
                  --include='*.env.example' --include='.env.example' \
                  --exclude-dir=.claude --exclude-dir=node_modules . 2>/dev/null \
                | grep -vE '=(<[^>]+>|CHANGE_ME[A-Z_]*|[A-Za-z_]*\.\.\.)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Похоже на настоящий секрет в *.env.example — там должны быть только имена и плейсхолдеры:"
            echo "$bad"
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tooling
        run: pip install --no-cache-dir pip-audit bandit ruff

      # ── Уязвимые зависимости ───────────────────────────────────────────────
      # Проверяем именно лок: он описывает то, что реально поедет в образ.
      # continue-on-error: --strict валит билд на ЛЮБОЙ известной уязвимости
      # независимо от серьёзности, а прод-лок тянет ~90 пакетов — до первого
      # разбора реальных находок это скорее шумный неблокирующий отчёт, чем
      # надёжный гейт. Убрать continue-on-error после того, как текущий список
      # находок разобран (исправлено / осознанно принято).
      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.lock --strict

      # ── SAST ───────────────────────────────────────────────────────────────
      # -ll: только MEDIUM и выше. LOW у bandit — это в основном assert в тестах
      # и «подозрительный» random, шум ради шума.
      - name: bandit
        run: bandit -r backend/ -ll --exclude backend/tests

      # continue-on-error: 1055 находок на момент подключения проверки — это
      # многолетний накопленный долг всего бэкенда (в основном F401
      # неиспользуемые импорты и DTZ naive-datetime, который здесь осознанный
      # выбор — см. backend/time_utils.py), а не то, что можно разобрать одним
      # коммитом. Проверка остаётся в CI и видна в логах — просто не блокирует
      # деплой, пока долг не разобран отдельным заходом.
      - name: ruff
        continue-on-error: true
        run: ruff check backend/

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # continue-on-error: npm audit по умолчанию считает и advisories из
      # devDependencies (сборочные инструменты, в проде не исполняются) —
      # частый источник шума без реального риска. Разобрать отдельно.
      - name: npm audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────
  # 3. Alembic autogenerate
  # ─────────────────────────────────────────────
  check-migrations:
    runs-on: ubuntu-latest
    # Раньше было только `pull_request`, а работа в проекте идёт пушами прямо
    # в main — то есть проверка не отрабатывала ни разу. Модель, изменённая без
    # миграции, доезжала до прода и падала на первом запросе к новой колонке.
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: astro
          POSTGRES_DB: astro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astro -d astro_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://astro:astro@localhost:5432/astro_test
      # Длина >= 32: приложение отказывается стартовать с коротким секретом
      # вне DEBUG/TESTING.
      JWT_SECRET: ci-only-secret-do-not-use-anywhere-else-0123456789
      TESTING: "true"
      EPHE_PATH: data/ephe
      OPENAI_API_KEY: ""

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements-dev.lock
          pip install --no-cache-dir --no-deps -e .

      - name: Apply existing migrations
        run: alembic upgrade head

      - name: Check for unapplied model changes
        run: |
          alembic revision --autogenerate -m "ci_check" 2>&1 | tee /tmp/alembic_out.txt
          MIGRATION=$(ls -t alembic/versions/*.py | head -1 | xargs basename)
          echo "Generated: $MIGRATION"
          if grep -qE "op\.(create_table|add_column|drop_column|alter_column|create_index|drop_index|drop_table)" "alembic/versions/$MIGRATION"; then
            echo "❌ Найдены модели без миграций! Запусти: alembic revision --autogenerate -m 'your message'"
            cat "alembic/versions/$MIGRATION"
            rm "alembic/versions/$MIGRATION"
            exit 1
          else
            echo "✅ Все модели покрыты миграциями"
            rm "alembic/versions/$MIGRATION"
          fi

  # ─────────────────────────────────────────────
  # 4. Frontend lint + build
  # ─────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────────
  # 5. Deploy на VPS по SSH (только main, только после зелёных тестов)
  # ─────────────────────────────────────────────
  # Никакого прямого доступа CI к прод-БД: миграции, дамп и health-check
  # выполняются на самом сервере через 05-update.sh (без флагов — "оба"),
  # который сам делает дамп перед пересборкой, docker compose build/up,
  # alembic upgrade head, ждёт healthy и автоматически откатывает api/bot
  # на предыдущий образ, если health-check после деплоя не прошёл; фронтенд
  # пересобирается тем же скриптом, но только если менялся app/frontend/.
  deploy:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security]
    # Только ручной запуск: Actions → CI/CD → Run workflow (ветка main).
    # Пуш в main прогоняет тесты, но на прод ничего не увозит.
    #
    # Раньше здесь стояло `github.event_name == 'push'`, а гарантией от
    # немедленного выезда считалось окружение production с Required reviewers.
    # Такой защиты нет и включить её нельзя: раздел Deployment protection rules
    # недоступен на текущем тарифном плане GitHub (ограничение плана, а не
    # настройки окружения — API отдаёт "protection_rules": []). То есть любой
    # push в main всё это время уезжал на прод сразу и без подтверждения.
    #
    # Окружение оставлено: оно даёт журнал деплоев и область для секретов.
    # Именем `production` регистронезависимо матчится окружение «Production».
    if: github.event_name == 'workflow_dispatch'

    environment: production

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/astro
            ./05-update.sh
