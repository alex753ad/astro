name: Mobile APK

# Сборка Android-APK. Запускается вручную и на push в ветку mobile — в main
# эта ветка не мержится, поэтому в ci.yml (push: [main]) её нет и быть не должно.
on:
  workflow_dispatch:
  push:
    branches: [mobile]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

# Actions запинены на SHA коммита, а не на плавающий тег — как в ci.yml,
# по той же причине: тег вида @v4 владелец репозитория action может
# передвинуть на произвольный код.

jobs:
  android-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 7 требует JDK 21 — на меньшей версии Gradle-плагин Android
      # не стартует вовсе.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "21"

      # Кэш Gradle отдельным шагом, а не через `cache: gradle` в setup-java:
      # тот считает ключ по gradle-файлам проекта, а их на этот момент ещё
      # не существует — каталог android/ генерируется ниже, из шаблона
      # Capacitor. Поэтому ключ привязан к версии Capacitor из lock-файла.
      - name: Кэш Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Сборка мобильного бандла
        working-directory: frontend
        run: npm run build:mobile

      # Прямая проверка того, ради чего заведён отдельный режим сборки.
      # Без неё дефект «в бандле остался относительный /api/v1» доехал бы до
      # APK и проявился уже на устройстве пустым экраном без объяснений.
      - name: Проверить, что в бандле абсолютный URL API
        working-directory: frontend
        run: |
          if ! grep -rq "https://www.aristeatime.ru/api/v1" dist-mobile/assets/; then
            echo "В dist-mobile нет абсолютного адреса API — .env.mobile не подхватился"
            exit 1
          fi
          if ! grep -rq "X-Client-Platform" dist-mobile/assets/; then
            echo "В dist-mobile нет заголовка мобильного клиента — VITE_MOBILE не подхватился"
            echo "Без него refresh придёт кукой, которую webview не получит,"
            echo "и пользователя выбросит из приложения через час."
            exit 1
          fi

      # Каталог android/ не в git (см. frontend/CAPACITOR.md), поэтому каждый
      # прогон генерирует его из шаблона Capacitor. Условие оставлено ради
      # локального запуска той же последовательности команд.
      - name: Создать Android-проект
        working-directory: frontend
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      # Иконка лаунчера. Шаблон Capacitor кладёт свою (проверено побайтово), и
      # без этого шага в APK уезжает именно она.
      #
      # Стоит ПОСЛЕ cap add/sync (до них каталога android/ ещё нет) и ДО сборки.
      # Порядок относительно cap sync проверен исполнением 10.09.2026: sync
      # трогает только assets/public, capacitor.config.json и список плагинов,
      # ресурсы в res/ не переписывает — то есть шаг можно было бы поставить и
      # после него. Здесь он раньше патчей манифеста по другой причине:
      # генератор ПЕРЕПИСЫВАЕТ AndroidManifest.xml (проставляет android:icon и
      # roundIcon и заодно переформатирует файл целиком). Атрибуты патчей это
      # переживают, но правильный порядок — генератор, а потом патчи и их
      # проверка, чтобы гарантией была последняя операция, а не первая.
      #
      # Режим «один логотип»: из assets/logo.png собираются и adaptive-иконка
      # (Android 8+), и legacy-PNG (API 23-25), и сплэш. Отключить сплэш нечем
      # — у генератора нет флага «только иконки»; сплэш до этого был дефолтным
      # шаблонным, замена согласована владельцем 10.09.2026.
      #
      # Цвет фона виден только там, где у исходника прозрачность; наш PNG
      # непрозрачен и заполняет видимую область целиком, так что флаг работает
      # страховкой на случай замены исходника на вариант с альфа-каналом.
      - name: Иконка приложения
        working-directory: frontend
        run: |
          npx @capacitor/assets generate --android --iconBackgroundColor '#CDBBE6' --iconBackgroundColorDark '#CDBBE6'

      # Правки нативного проекта, который генерируется заново каждым прогоном.
      # Падает, если якорь не найден: молчаливый пропуск дал бы APK без
      # настройки, о наличии которой все уверены.
      - name: Патчи нативного проекта
        working-directory: frontend
        run: node scripts/patch-android.mjs

      # Проверка отдельно от самого патча: тот падает, если не нашёл якорь, а
      # эта строка ловит противоположный случай — якорь нашёлся, замена прошла,
      # но следующая версия шаблона Capacitor переписала атрибут по-своему.
      #
      # windowSoftInputMode добавлен 09.09.2026 вместе с чатом: у него поле
      # ввода прижато к низу шторки, и при adjustPan клавиатура накрыла бы его
      # целиком. Шаблон Capacitor этот атрибут не ставит вовсе, то есть без
      # патча режим выбирает система — и выбор не гарантирован.
      - name: Проверить allowBackup, ориентацию и режим клавиатуры
        working-directory: frontend
        run: |
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="portrait"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:windowSoftInputMode="adjustResize"' android/app/src/main/AndroidManifest.xml

      # Проверка результата генератора — по ФАКТУ в res/, а не по успеху шага
      # выше. Мимо неё прошёл бы отказ, который ничего не роняет: генератор
      # ничего не нашёл в assets/ и честно отработал вхолостую, а APK уехал с
      # шаблонной иконкой Capacitor. Ровно этот класс отказа тут и ловится.
      #
      # Эталон берётся из самого шаблона (tarball внутри @capacitor/cli), а не
      # прибитой хеш-строкой: при апгрейде Capacitor шаблонная иконка может
      # смениться, и прибитый хеш начал бы сравнивать с несуществующим больше
      # состоянием, то есть проходить всегда.
      #
      # Проверяются ОБА пути: adaptive-иконка (её и видно на Android 8+) и
      # legacy-PNG (API 23-25, у нас minSdkVersion 23). Только legacy было бы
      # недостаточно: система на 8+ берёт mipmap-anydpi-v26 и на PNG не смотрит.
      - name: Проверить, что иконка не шаблонная
        working-directory: frontend
        run: |
          res=android/app/src/main/res
          tpl=$(mktemp -d)
          tar xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C "$tpl"
          tplres="$tpl/app/src/main/res"

          if cmp -s "$tplres/mipmap-xxxhdpi/ic_launcher.png" "$res/mipmap-xxxhdpi/ic_launcher.png"; then
            echo "ic_launcher.png побайтово равен шаблону Capacitor — генератор иконки не отработал"
            exit 1
          fi
          if cmp -s "$tplres/mipmap-xxxhdpi/ic_launcher_foreground.png" "$res/mipmap-xxxhdpi/ic_launcher_foreground.png"; then
            echo "ic_launcher_foreground.png шаблонный — adaptive-иконка осталась дефолтной,"
            echo "и на Android 8+ в лаунчере будет иконка Capacitor, а не логотип."
            exit 1
          fi
          # Этого файла в шаблоне нет вовсе: там фон adaptive-иконки — цвет в
          # values/, а не картинка в mipmap-. Значит его наличие само по себе
          # означает, что слои переписаны генератором.
          test -f "$res/mipmap-xxxhdpi/ic_launcher_background.png"
          grep -q 'ic_launcher_foreground' "$res/mipmap-anydpi-v26/ic_launcher.xml"

      # SDK на образе runner'а уже стоит, но состав платформ меняется от
      # образа к образу. sdkmanager идемпотентен: если пакет есть, шаг
      # проходит за секунды.
      - name: Android SDK — platform 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Проверить SDK-уровни
        working-directory: frontend/android
        run: |
          echo "--- variables.gradle ---"
          cat variables.gradle
          grep -q "minSdkVersion = 23" variables.gradle
          grep -q "targetSdkVersion = 35" variables.gradle

      - name: assembleDebug
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: astrea-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
