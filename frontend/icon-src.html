<!doctype html><html><head><meta charset="UTF-8"><style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  svg{display:block;width:100%;height:100%}
</style></head><body>
<!-- Исходник иконки приложения: та же литера, что в src/assets/aristea-a.svg.
     Размер кадра задаёт --window-size хрома, вёрстка от него не зависит.

     ⚠️ Масштаб 1.28 от центра буквы (28, 28.5) выбран по геометрии adaptive
     icon: генератор кладёт кадр в inset 16.7%, что совпадает с видимой
     областью лаунчера, то есть доля буквы в кадре = доля в иконке
     (docs/HISTORY-mobile.md). Буква занимает ~67% ширины — ровно столько же
     занимал прежний исходник, принятый на устройстве 10.09.2026. -->
<svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <rect width="56" height="56" fill="#5B3A9E"/>
  <g transform="translate(28,28.5) scale(1.28) translate(-28,-28.5)">
    <path d="M15 42 L28 15 L41 42" fill="none" stroke="#FFFFFF" stroke-width="3.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21 31 L35 31" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>
</body></html>
