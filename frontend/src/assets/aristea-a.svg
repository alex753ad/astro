<!--
  Литера «A» Аристеи — ОДИН источник формы на кнопку чата и на иконку
  приложения (решение владельца 16.09.2026, форма «в» без звезды).

  ⚠️ Вершина ЗАКРЫТА. В варианте «в» из стенда на её месте стояла звезда, и
  после её удаления остался бы вырез — буква читалась бы как сломанная. Здесь
  два луча сведены в одну точку скруглением (stroke-linejoin: round), то есть
  вершина нормальная, а не «место, откуда что-то убрали».

  ⚠️ Без засечек и без звёзд намеренно: форма живёт на 56 px (кнопка чата) и
  на 24 px (мелкие места). Растровый logo.png с серебром и свечением для этих
  размеров не годится вовсе — плюс в его правом нижнем углу стоит знак ✦,
  похожий на водяной знак генератора изображений, и переносить его в новые
  ассеты запрещено.

  ⚠️ Цвет — currentColor. Значок перекрашивается вместе с состоянием кнопки
  (активная/недоступная) и темой; зашитый цвет сделал бы это невозможным.
  viewBox 56×56 совпадает с размером кнопки: масштабируется одним атрибутом.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none" role="img" aria-label="Аристея">
  <path d="M15 42 L28 15 L41 42"
        stroke="currentColor" stroke-width="3.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M21 31 L35 31"
        stroke="currentColor" stroke-width="3.2"
        stroke-linecap="round"/>
</svg>
