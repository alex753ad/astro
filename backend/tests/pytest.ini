[pytest]
# Обязательно ДУБЛИРОВАТЬ здесь то, что стоит в pyproject.toml.
#
# Этот файл лежит в каталоге, который передаётся pytest аргументом
# (`pytest backend/tests/`), поэтому pytest берёт rootdir = backend/tests и
# читает конфиг ОТСЮДА, а [tool.pytest.ini_options] из pyproject.toml не
# применяется вовсе. Из-за отсутствия строки ниже все async-тесты без явного
# @pytest.mark.asyncio не запускались: pytest возвращал корутину, не дожидаясь
# её, тест падал с "coroutine was never awaited". Так молча не работали 17
# тестов каскада AI.
asyncio_mode = auto

markers =
    integration: requires Swiss Ephemeris data files (EPHE_PATH)
    load: load/stress tests (slow, run separately)
    unit: fast unit tests without external dependencies
    external: ходит в живой внешний сервис (Nominatim и т.п.) — вне обычного прогона

# По умолчанию пропускаем нагрузочные тесты и всё, что ходит наружу.
#
# `external` исключён здесь, а не спрятан за skipif внутри теста: skipif
# делает тест невидимым (он не запускается никогда и не значится в отчёте как
# намеренно отложенный), а маркер оставляет его запускаемым одной командой —
# `pytest backend/tests/ -m external`. Остальному прогону сеть наружу закрыта
# фикстурой no_outbound_network (conftest.py), чтобы зелёный результат не
# зависел от состояния чужого сервера.
addopts = -v --tb=short -m "not load and not external"

# Таймаут для отдельного теста (требует pytest-timeout)
# timeout = 30