x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-build: &app-build
  context: ./app
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    # cap_drop здесь нельзя: initdb в postgres делает chown и setuid.
    # Без лимита одна утечка памяти в любом сервисе кладёт весь хост —
    # OOM-killer выбирает жертву сам, и это далеко не всегда виновник.
    mem_limit: 1g
    logging: *default-logging
    networks:
      - astro_net

  redis:
    image: redis:7-alpine
    restart: always
    # requirepass: сеть astro_net общая для всех контейнеров, и до перехода на
    # пароль любой из них (или что угодно, что в нём выполнится) получал полный
    # доступ к Redis. А там лежат SSE-тикеты, денилист JWT, счётчики лимитов и
    # серверная история RAG-чата.
    # Переименованный CONFIG закрывает классику: CONFIG SET dir + dbfilename
    # позволяет писать RDB в произвольный файл, то есть выполнить код.
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD не задан в .env}
      --rename-command CONFIG ""
      --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # SETUID/SETGID оставлены намеренно: entrypoint официального образа
    # стартует от root и сбрасывает права через su-exec — без этих двух
    # capability контейнер не поднимется вовсе.
    cap_add: [SETUID, SETGID]
    # Redis пишет RDB в /data — read_only тут не поставить.
    mem_limit: 512m
    logging: *default-logging
    networks:
      - astro_net

  api:
    image: astro-app:latest
    build: *app-build
    restart: always
    env_file:
      - .env
    environment:
      PORT: "8000"
      EPHE_PATH: /app/data/ephe
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1500m
    cpus: 1.5
    logging: *default-logging
    networks:
      - astro_net

  bot:
    image: astro-app:latest
    build: *app-build
    restart: always
    env_file:
      - .env
    environment:
      SERVICE_ROLE: bot
      EPHE_PATH: /app/data/ephe
    depends_on:
      api:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    logging: *default-logging
    networks:
      - astro_net

  # backend/celery_app.py и backend/tasks.py существовали и были написаны
  # полностью, но ни один процесс их не забирал: .delay()/.apply_async()
  # клали задачу в Redis, и она лежала там до истечения TTL (result_expires,
  # 1 час) никем не обработанная. Рассылка клиентам из CRM отвечала
  # {"queued": true} и ничего не отправляла, POST /transits/async всегда
  # заканчивался таймаутом на фронте.
  worker:
    image: astro-app:latest
    build: *app-build
    restart: always
    env_file:
      - .env
    environment:
      SERVICE_ROLE: worker
      EPHE_PATH: /app/data/ephe
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping --timeout 5 | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    logging: *default-logging
    networks:
      - astro_net

  # Планировщик задач по расписанию (beat_schedule в celery_app.py): лунные
  # возвращения, еженедельный дайджест, ежемесячная рассылка клиентам.
  # Отдельный процесс от worker — по дизайну Celery beat не должен запускаться
  # больше одного раза, иначе периодические задачи ставятся в очередь дважды.
  beat:
    image: astro-app:latest
    build: *app-build
    restart: always
    env_file:
      - .env
    environment:
      SERVICE_ROLE: beat
      EPHE_PATH: /app/data/ephe
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    logging: *default-logging
    networks:
      - astro_net

  uptime-kuma:
    image: louislam/uptime-kuma:1
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv6first"
    extra_hosts:
      - "api.telegram.org:2001:67c:4e8:f004::9"
      - "www.astreatime.ru:2a03:6f00:a::3:f6b"
    restart: always
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    logging: *default-logging
    networks:
      - astro_net

volumes:
  pgdata:
  redis_data:
  uptime_kuma_data:

networks:
  astro_net:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd00:cafe:1::/64
