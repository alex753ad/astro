# Директивы уровня http — кладётся в /etc/nginx/conf.d/, подхватывается до
# sites-enabled. Всё, что нельзя объявить внутри server{}, живёт здесь.

# Версия nginx в Server: и на страницах ошибок — бесплатная подсказка о том,
# какие CVE пробовать. Отдаём просто "nginx".
server_tokens off;

# ── TLS ──────────────────────────────────────────────────────────────────────
# Общая политика для всех виртуалхостов, чтобы не расходилась по файлам.
# HIGH:!aNULL:!MD5 (было раньше) пропускает CBC-наборы; здесь только AEAD.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
# При TLS 1.3 порядок клиента корректнее: он лучше знает, что у него аппаратно
# ускорено (CHACHA20 на телефонах, AES-NI на десктопах).
ssl_prefer_server_ciphers off;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
# Тикеты без ротации ключа ломают forward secrecy: один утёкший ключ
# расшифровывает все сессии, переиспользовавшие тикет.
ssl_session_tickets off;

ssl_stapling on;
ssl_stapling_verify on;
resolver 127.0.0.53 1.1.1.1 valid=300s;
resolver_timeout 5s;

# ── Rate limiting ────────────────────────────────────────────────────────────
# Второй рубеж перед приложением: nginx отбивает запрос, не тратя воркер
# uvicorn, соединение с Postgres и Redis. Ключ — $binary_remote_addr, то есть
# реальный адрес клиента (nginx стоит первым, X-Forwarded-For подделывается).
#
# 10r/s на api — с запасом: SPA делает по десятку запросов на открытие экрана.
# 1r/s на auth — вход, регистрация, отправка кода; человеку хватает.
# 2r/s на share — публичная генерация PNG 1080×1920 плюс запрос к LLM.
limit_req_zone $binary_remote_addr zone=api:10m    rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m   rate=1r/s;
limit_req_zone $binary_remote_addr zone=share:10m  rate=2r/s;
limit_req_status 429;
limit_req_log_level warn;

# Одновременные соединения с одного адреса — против медленного истощения
# воркеров открытыми SSE-стримами.
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn_status 429;

# ── Размер тела запроса ──────────────────────────────────────────────────────
# Всё, что принимает API, кроме одной ручки, — это JSON форм и анкет.
# Исключение — /api/v1/feedback со скриншотом до 5 МБ: для него лимит поднят
# в отдельном location (см. astreatime.conf), иначе nginx отбивал бы 413
# раньше, чем приложение успевало проверить размер само.
client_max_body_size 1m;
client_body_timeout 15s;
client_header_timeout 15s;
