# astreatime.ru — фронтенд (статика) + проксирование API.
#
# Общие для всего nginx настройки (TLS-политика, server_tokens, зоны
# limit_req) живут в conf.d/00-astro-hardening.conf: они уровня http и
# внутри server{} объявлены быть не могут.
#
# Защитные заголовки подключаются через include в КАЖДЫЙ location. Так надо
# потому, что add_header не складывается: как только в дочернем блоке
# появляется свой add_header (например Cache-Control), все унаследованные
# заголовки из родителя молча исчезают.

# ── Заглушка для чужого Host ─────────────────────────────────────────────────
# Наверх передаётся Host как есть (proxy_set_header Host $host), поэтому запрос
# с подставленным Host долетал бы до приложения и попадал в ссылки писем и в
# кэш. Дефолтный сервер закрывает это на входе: 444 — разрыв без ответа.
server {
    listen 80  default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Сертификат тот же — рукопожатие всё равно надо завершить, чтобы ответить.
    # ssl_reject_handshake был бы чище, но он появился в nginx 1.19.4, а версия
    # на сервере не зафиксирована; return 444 работает везде.
    ssl_certificate     /etc/letsencrypt/live/astreatime.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astreatime.ru/privkey.pem;

    return 444;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name astreatime.ru www.astreatime.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — основной сайт ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name astreatime.ru www.astreatime.ru;

    ssl_certificate     /etc/letsencrypt/live/astreatime.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astreatime.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/astreatime.ru/chain.pem;
    # ssl_protocols / ssl_ciphers / ssl_session_* — в conf.d/00-astro-hardening.conf

    root /opt/astro/frontend/dist;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Не больше 30 одновременных соединений с адреса. SSE-стримы держат
    # соединение открытым минутами, и без потолка десяток вкладок в цикле
    # реконнекта выбирает пул воркеров.
    limit_conn perip 30;

    # ── Служебные (cron) эндпоинты ───────────────────────────────────────────
    # Вызываются только с самого сервера (systemd-таймеры, бот в контейнере).
    # Второй рубеж поверх X-Internal-Secret: даже при пустом секрете снаружи
    # сюда не достучаться. Блок ДО location /api/ — префиксные location в nginx
    # выбираются по самому длинному совпадению, так что порядок роли не играет,
    # но читается так честнее.
    location /api/v1/internal/ {
        allow 127.0.0.1;
        allow ::1;
        # Контейнеры astro_net — бот ходит в API по внутренней сети.
        allow 172.28.0.0/16;
        deny all;

        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ── Аутентификация ───────────────────────────────────────────────────────
    # Отдельная зона: вход, регистрация и отправка кода на почту — единственные
    # ручки, где перебор и рассылка писем стоят дорого. burst без nodelay,
    # чтобы всплеск не отбивался, а выстраивался в очередь.
    location /api/v1/auth/ {
        limit_req zone=auth burst=10;

        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Скриншот к отзыву — до 5 МБ (проверка размера есть и в приложении).
    location /api/v1/feedback {
        client_max_body_size 6m;
        limit_req zone=api burst=20 nodelay;

        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;

        include /etc/nginx/snippets/security-headers.conf;

        # Литерал 127.0.0.1 намеренный — не заменять на имя сервиса
        # (http://api:8000). Сеть astro_net поднята с enable_ipv6, резолв имени
        # может уйти в AAAA, и peer, который увидит приложение, станет
        # IPv6-шлюзом fd00:cafe:1::1. Его нет в TRUSTED_PROXY_IPS, поэтому
        # client_ip перестанет доверять X-Forwarded-For и вернёт сам шлюз —
        # тот не входит в подсети ЮKassa, и ВСЕ вебхуки начнут отбиваться 403:
        # деньги списываются, подписки не выдаются, в логах только ERROR.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Публичные страницы шаринга и PNG-карточки: рендер картинки 1080×1920 плюс
    # запрос к LLM за подписью на каждый новый токен.
    location /share/ {
        limit_req zone=share burst=10 nodelay;

        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Диагностика ──────────────────────────────────────────────────────────
    # /health отдаём наружу (Uptime Kuma опрашивает его через интернет), а
    # /health/db — только с локалхоста: даже без текста исключения сам факт
    # ответа "database: error" — бесплатная разведка состояния инфраструктуры.
    location = /health/db {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /health {
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # /metrics — Prometheus. Наружу отдавать нечего: там количество юзеров,
    # тарифы, расход на AI.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        allow 172.28.0.0/16;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
    }

    # Service worker не должен кэшироваться: иначе обновление приложения
    # доезжает до пользователя только после того, как протухнет старый sw.js.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        try_files $uri $uri/ /index.html;
    }
}
