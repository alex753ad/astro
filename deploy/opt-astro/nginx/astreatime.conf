# aristeatime.ru — фронтенд (статика) + проксирование API.
#
# Общие для всего nginx настройки (TLS-политика, server_tokens, зоны
# limit_req) живут в conf.d/00-astro-hardening.conf: они уровня http и
# внутри server{} объявлены быть не могут.
#
# Защитные заголовки подключаются через include в КАЖДЫЙ location. Так надо
# потому, что add_header не складывается: как только в дочернем блоке
# появляется свой add_header (например Cache-Control), все унаследованные
# заголовки из родителя молча исчезают.

# ── Заглушка для чужого Host ─────────────────────────────────────────────────
# Наверх передаётся Host как есть (proxy_set_header Host $host), поэтому запрос
# с подставленным Host долетал бы до приложения и попадал в ссылки писем и в
# кэш. Дефолтный сервер закрывает это на входе: 444 — разрыв без ответа.
server {
    listen 80  default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Сертификат тот же — рукопожатие всё равно надо завершить, чтобы ответить.
    # ssl_reject_handshake был бы чище, но он появился в nginx 1.19.4, а версия
    # на сервере не зафиксирована; return 444 работает везде.
    ssl_certificate     /etc/letsencrypt/live/astreatime.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astreatime.ru/privkey.pem;

    return 444;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name astreatime.ru www.astreatime.ru aristeatime.ru www.aristeatime.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: КАНОНИЧЕСКИЙ хост ------------------------------------------
# Единственное имя, под которым сайт должен быть в выдаче. Три остальных
# (старый бренд и www) отдают 301 сюда — редиректный сервер в конце файла.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aristeatime.ru;

    # Путь live/astreatime.ru/ — со старым доменом, и это НЕ недоделка
    # переименования. Сертификат расширен на все четыре имени через
    # certbot --expand, а имя каталога certbot берёт от первого домена и
    # при --expand не меняет. Переписать путь на aristeatime.ru — сломать
    # TLS: такого каталога не существует.
    ssl_certificate     /etc/letsencrypt/live/astreatime.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astreatime.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/astreatime.ru/chain.pem;
    # ssl_protocols / ssl_ciphers / ssl_session_* — в conf.d/00-astro-hardening.conf

    root /opt/astro/frontend/dist;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Не больше 30 одновременных соединений с адреса. SSE-стримы держат
    # соединение открытым минутами, и без потолка десяток вкладок в цикле
    # реконнекта выбирает пул воркеров.
    limit_conn perip 30;

    # ---- Проксирование на приложение ------------------------------------
    # /api/*, /share/, /health, /metrics. Вынесено в сниппет: тот же набор
    # обязан жить и в редиректном сервере ниже, а в nginx location между
    # server-блоками не наследуются.
    include /etc/nginx/snippets/backend-locations.conf;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
    }

    # Service worker не должен кэшироваться: иначе обновление приложения
    # доезжает до пользователя только после того, как протухнет старый sw.js.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Статика в корне: иконки, og-картинка, манифест, robots.txt, sitemap.xml.
    #
    # Нужна отдельным блоком, потому что location / ниже стал no-cache ради
    # HTML, а этим файлам такое ни к чему: их содержимое от сборки к сборке не
    # меняется, а og-preview.png тянут краулеры мессенджеров. Час — компромисс:
    # заметно лучше, чем каждый раз заново, и достаточно мало, чтобы правка
    # robots.txt доехала в тот же день.
    #
    # Regex-блок проверяется раньше префиксного location /, но позже точных
    # location = (/sw.js, /index.html) — те сохраняют своё поведение.
    location ~* ^/[^/]+\.(png|jpg|jpeg|svg|ico|webp|woff2?|json|txt|xml)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- Страницы -------------------------------------------------------
    #
    # try_files находит сначала настоящий файл: публичные страницы лежат в dist
    # готовым HTML (пререндер, frontend/scripts/prerender.mjs), поэтому /pricing
    # отдаётся из dist/pricing/index.html со статусом 200 и с текстом внутри.
    #
    # Всё, что файлом не нашлось, уходит в @spa — там решается, настоящий это
    # маршрут приложения или мусор.
    #
    # Cache-Control обязателен: в HTML запечено имя бандла с хешем, и страница,
    # закэшированная браузером по эвристике, после деплоя сошлётся на файл,
    # которого больше нет.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        # ⚠️ $uri/index.html стоит РАНЬШЕ $uri/ намеренно, и это не стилистика.
        #
        # С `try_files $uri $uri/ @spa` (так было при выкате 14.09.2026) адрес
        # /pricing попадал на проверку каталога, и nginx отвечал 301 на
        # /pricing/ — своим штатным редиректом на индекс каталога. Поймано на
        # живом сервере сразу после деплоя.
        #
        # Чем это плохо именно здесь: в sitemap и в <link rel="canonical">
        # стоит адрес БЕЗ слеша. Google шёл по /pricing, получал 301 на
        # /pricing/, а там canonical указывал обратно на /pricing — то есть
        # канонический адрес сам себя перенаправлял. Такой canonical поисковик
        # обычно игнорирует, и вся расстановка канонических адресов
        # обесценивается молча.
        #
        # $uri/index.html отдаёт dist/pricing/index.html напрямую, без
        # редиректа. Для «/» первым сработает $uri (он заканчивается слешем,
        # значит проверяется как каталог) — поведение главной не меняется.
        try_files $uri $uri/index.html $uri/ @spa;
    }

    # ---- SPA-фолбэк и честный 404 ---------------------------------------
    #
    # $is_app_route задаёт map из conf.d/10-astro-routes.conf. Файл
    # ГЕНЕРИРУЕТСЯ сборкой из frontend/src/routes.js — единственного списка
    # маршрутов в проекте, из которого кормятся ещё роутер, sitemap и
    # пререндер. Руками его не писать и в репозиторий не класть.
    #
    # До 14.09.2026 здесь стоял безусловный `try_files ... /index.html`, и
    # сервер отвечал 200 на любой адрес, включая заведомо несуществующий. Для
    # поисковика это «страница есть» — софт-404.
    #
    # Отдаём app.html, а НЕ index.html: после пререндера index.html — это
    # лендинг со своим <link rel="canonical"> на «/». Ответив им на /profile,
    # мы сообщили бы поисковику, что /profile на самом деле главная. app.html —
    # чистый шелл, он про себя ничего не утверждает.
    #
    # ⚠️ `if` внутри location в nginx — известная ловушка, но `return` входит в
    # те два случая, которые официально безопасны. Обойтись без него нельзя:
    # последним аргументом try_files код =404 из переменной не разворачивается.
    location @spa {
        if ($is_app_route = 0) {
            return 404;
        }

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        try_files /app.html =404;
    }

    # Страница 404 — тоже результат пререндера (NotFoundPage.jsx), с noindex
    # внутри. internal: снаружи по /404.html не зайти, только через error_page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
    }
}

# ---- HTTPS: НЕканонические хосты -> 301 на канонический ---------------------
#
# Старый бренд (astreatime.ru) и www обоих брендов. Четыре имени отдавали один
# и тот же сайт со статусом 200 и без canonical — Google в такой ситуации сам
# выбирает главный адрес, и не обязательно тот, который нужен нам.
#
# ⚠️⚠️ /api/ ИЗ РЕДИРЕКТА ИСКЛЮЧЁН НАВСЕГДА. Это не недоделка и не
# непоследовательность — не убирать.
#
# Мобильное приложение прибито к абсолютному адресу
# https://www.aristeatime.ru/api/v1 (frontend/.env.mobile, попадает в бандл
# APK на этапе сборки). Коды 301 и 302 по историческому поведению клиентов
# превращают POST в GET и теряют тело запроса. Пусти мы /api/ через редирект —
# у КАЖДОГО уже установленного приложения перестанут работать вход,
# регистрация, построение карты и оплата, причём разом и без единой ошибки в
# логах приложения. Обновить уже установленные APK задним числом нельзя.
#
# По той же причине здесь не редиректятся /share/ (превью в мессенджерах по
# уже разосланным ссылкам) и /health (его опрашивает Uptime Kuma снаружи).
#
# Снять исключение можно будет только тогда, когда ни одного APK со старым
# адресом не останется в природе. Практически — никогда.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aristeatime.ru astreatime.ru www.astreatime.ru;

    # Тот же сертификат: он расширен на все четыре имени через certbot
    # --expand. Без него рукопожатие не состоится и до редиректа дело не
    # дойдёт вовсе. Про имя каталога live/astreatime.ru — см. комментарий у
    # канонического сервера выше.
    ssl_certificate     /etc/letsencrypt/live/astreatime.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astreatime.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/astreatime.ru/chain.pem;

    limit_conn perip 30;

    include /etc/nginx/snippets/backend-locations.conf;

    location / {
        return 301 https://aristeatime.ru$request_uri;
    }
}
