# Content-Security-Policy.
#
# Для SPA, которая держит токен в браузере, CSP — не косметика, а основной
# барьер: она отсекает доставку XSS-полезной нагрузки, а не только её запуск.
#
# ── Как выкатывать ───────────────────────────────────────────────────────────
# Сейчас включён РЕЖИМ НАБЛЮДЕНИЯ (Report-Only): браузер ничего не блокирует,
# только пишет нарушения в консоль. Держать 1–2 недели, собрать нарушения,
# затем закомментировать строку -Report-Only и раскомментировать боевую.
#
# ── Откуда взялся каждый источник ────────────────────────────────────────────
#   fonts.googleapis.com / fonts.gstatic.com — <link> на Google Fonts в index.html
#   nominatim.openstreetmap.org              — геокодер в BirthForm/Relocation/Solar/Synastry
#   www.googleapis.com / accounts.google.com — Google Calendar и OAuth (useGoogleCalendar.js)
#   *.ingest.sentry.io                       — @sentry/react, если задан VITE_SENTRY_DSN
#   blob: в img-src                          — PNG-карточка и превью карты рисуются в canvas
#   worker-src 'self'                        — service worker (/sw.js)
#
# script-src БЕЗ 'unsafe-inline' — это главная ценность всей политики. Инлайновый
# скрипт регистрации service worker для этого вынесен из index.html в main.jsx.
# style-src с 'unsafe-inline' оставлен осознанно: React и Tailwind ставят style=
# на элементы, а инлайновые стили не дают выполнить код.

set $astro_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://nominatim.openstreetmap.org https://www.googleapis.com https://accounts.google.com https://*.ingest.sentry.io https://*.sentry.io; frame-src https://accounts.google.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests";

add_header Content-Security-Policy-Report-Only $astro_csp always;
# add_header Content-Security-Policy            $astro_csp always;
