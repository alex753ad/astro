# Защитные заголовки. Подключается через include в КАЖДЫЙ location, который
# отдаёт ответ, — add_header наследуется только пока в дочернем блоке нет
# собственного add_header; там, где он есть (например Cache-Control), все
# родительские заголовки молча пропадают. Отсюда include, а не один блок в server.
#
# `always` обязателен: без него заголовки не попадают в ответы 4xx/5xx, то есть
# именно туда, где чаще всего и рисуют фишинговый фрейм или сниффят тип контента.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# preload в HSTS намеренно НЕ включён: он необратим на уровне браузеров и
# требует, чтобы ВСЕ поддомены (включая status.astreatime.ru) уже работали по
# HTTPS. Добавлять после того, как поддомены переведены и всё отстоялось месяц.
