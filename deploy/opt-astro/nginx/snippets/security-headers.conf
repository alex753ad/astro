# Защитные заголовки. Подключается через include в КАЖДЫЙ location, который
# отдаёт ответ, — add_header наследуется только пока в дочернем блоке нет
# собственного add_header; там, где он есть (например Cache-Control), все
# родительские заголовки молча пропадают. Отсюда include, а не один блок в server.
#
# `always` обязателен: без него заголовки не попадают в ответы 4xx/5xx, то есть
# именно туда, где чаще всего и рисуют фишинговый фрейм или сниффят тип контента.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
# COOP: same-origin-allow-popups, а НЕ same-origin. Разница ровно в попапах,
# которые открывает сама страница, и от неё зависит вход в Google Calendar.
#
# Что осталось: документ по-прежнему изолирован от того, кто открыл НАС, —
# чужая страница, открывшая нас окном, не получает ссылку на наш window.
# Это и есть защита от XS-Leaks, ради которой заголовок ставился.
#
# Что ослаблено: попапы, открытые НАМИ, сохраняют связь с открывателем.
# Именно её рвал same-origin, и на ней держится popup-режим Google Identity
# Services: токен GIS отдаёт в колбэк, но отмену определяет слежением за
# окном. У оборванной ссылки окно выглядит закрытым, и GIS сообщает
# popup_closed при видимо открытом экране выбора аккаунта — 02.09.2026 это
# приходило через 1278 мс после клика, пользователь ничего не закрывал.
#
# ⚠️ Почему ручная проверка в консоли гипотезу НЕ опровергла. Строка вида
#   const w = window.open("https://accounts.google.com", "t", "width=100,height=100");
#   setTimeout(() => console.log(w.closed), 500)
# печатает false — и это не доказывает, что связь цела. Условия разные:
# вызов из консоли идёт от привилегированного контекста DevTools, без
# фич-строки GIS и без его последовательности навигаций внутри окна.
# Проверять COOP надо по симптому в самом GIS, а не суррогатом.
# Потрачен один заход 02.09.2026: проверка дала false, гипотеза была снята
# как опровергнутая, и вернулись к ней только по времени срабатывания.
#
# Заголовок выставляется ТОЛЬКО здесь — ни в одном location, ни в бэкенде
# (middleware в main.py его не трогает) второго add_header нет. Если появится
# второй в дочернем location, победит он, а вместе с ним пропадут и все
# остальные заголовки этого файла: add_header в дочернем блоке отменяет
# родительские целиком. Отсюда include в каждый location, а не один на server.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# preload в HSTS намеренно НЕ включён: он необратим на уровне браузеров и
# требует, чтобы ВСЕ поддомены (включая status.aristeatime.ru) уже работали по
# HTTPS. Добавлять после того, как поддомены переведены и всё отстоялось месяц.
