# backend-locations.conf — проксирование на приложение.
#
# Подключается в ОБА https-сервера astreatime.conf: канонический
# (aristeatime.ru) и редиректный (www.aristeatime.ru, astreatime.ru,
# www.astreatime.ru). В nginx location не наследуются между server-блоками,
# поэтому иначе эти 219 строк пришлось бы держать в файле дважды.
#
# ⚠️ Почему копия была бы хуже, а не просто длиннее. Расходятся такие копии
# молча и при первой же правке: новый таймаут, смена зоны limit_req, лишний
# proxy_set_header — внесли в один блок, забыли во втором. Дефект после этого
# виден ТОЛЬКО на старых хостах, а на них ходит мобильное приложение
# (.env.mobile указывает на www), то есть проявился бы он у пользователей APK
# и никогда — при проверке сайта в браузере.
#
# ⚠️ Именно эти ручки обязаны работать на ВСЕХ хостах без редиректа. Причина —
# в astreatime.conf, у блока редиректа; коротко: 301 превращает POST в GET,
# а установленные APK прибиты к https://www.aristeatime.ru/api/v1.
#
# Файл подключается ВНУТРИ server{}: здесь только location, ничего уровня http.

    # ── Служебные (cron) эндпоинты ───────────────────────────────────────────
    # Вызываются только с самого сервера (systemd-таймеры, бот в контейнере).
    # Второй рубеж поверх X-Internal-Secret: даже при пустом секрете снаружи
    # сюда не достучаться. Блок ДО location /api/ — префиксные location в nginx
    # выбираются по самому длинному совпадению, так что порядок роли не играет,
    # но читается так честнее.
    location /api/v1/internal/ {
        allow 127.0.0.1;
        allow ::1;
        # Контейнеры astro_net — бот ходит в API по внутренней сети.
        allow 172.28.0.0/16;
        deny all;

        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ── Сессионные ручки /auth/ — В ОБЫЧНОЙ зоне, не в строгой ───────────────
    #
    # ⚠️ Этот блок обязан стоять ОТДЕЛЬНО от /api/v1/auth/ ниже, и вот почему.
    # Зона auth намеренно задерживающая: burst без nodelay, rate=1r/s на адрес
    # — лишние запросы не отбиваются, а ждут в очереди ПО СЕКУНДЕ каждый. Для
    # входа и рассылки кода это ровно то, что нужно. Но три ручки ниже дёргает
    # КАЖДАЯ сессия при каждом старте, и они попадали под тот же префикс.
    #
    # Что из-за этого ломалось (найдено приёмкой мобильного приложения
    # 07.09.2026, разбор — CLAUDE.md, «Холодный старт упирается в
    # ЗАДЕРЖИВАЮЩИЙ лимит»): на холодном старте приложение монтирует три
    # экрана разом, все получают 401 по протухшему access и сходятся в один
    # /auth/refresh. Тот встаёт в очередь — и ждут все три экрана сразу.
    # Замер на этом сервере: запросы зоны api ответили за 1.2 с, refresh — за
    # 4.1 с; 12 параллельных refresh — 1.9…11.9 с и 429. Экраны упирались в
    # свой 15-секундный таймаут и показывали «Сервер не отвечает», а 429
    # клиент (справедливо) не считает отказом в аутентификации и не
    # разлогинивает — приложение оставалось в тупике до переустановки.
    #
    # Перебором это не пахнет: refresh и sse-ticket проверяются подписью
    # токена, /auth/me требует валидного access. Общий потолок им даёт зона
    # api (10r/s) и limit_conn perip.
    #
    # Регулярное выражение, а не три `location =`: один блок вместо трёх копий
    # proxy_pass. Regex-location проверяются раньше префиксных, поэтому этот
    # блок выигрывает у /api/v1/auth/ независимо от порядка в файле.
    location ~ ^/api/v1/auth/(refresh|me|sse-ticket)$ {
        limit_req zone=api burst=20 nodelay;

        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ── Аутентификация ───────────────────────────────────────────────────────
    # Отдельная зона: вход, регистрация и отправка кода на почту — единственные
    # ручки, где перебор и рассылка писем стоят дорого. burst без nodelay,
    # чтобы всплеск не отбивался, а выстраивался в очередь.
    #
    # Сессионные ручки (refresh, me, sse-ticket) сюда НЕ попадают — они
    # перехвачены regex-блоком выше. Не «упростить», убрав его: см. разбор там.
    location /api/v1/auth/ {
        limit_req zone=auth burst=10;

        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Скриншот к отзыву — до 5 МБ (проверка размера есть и в приложении).
    location /api/v1/feedback {
        client_max_body_size 6m;
        limit_req zone=api burst=20 nodelay;

        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # PDF натальной карты — единственная ручка /api/, которая принимает не
    # JSON формы, а картинку: колесо карты снимается в canvas 1200x1200 и
    # уходит в теле как base64 (wheel_png, см. captureSvgPng в ChartPage.jsx).
    #
    # Глобальный client_max_body_size 1m (conf.d/00-astro-hardening.conf) для
    # неё мал, и отказ приходит от nginx РАНЬШЕ приложения: человек видит
    # «HTTP 413», а не объяснение, потому что в теле 413 у nginx нет detail.
    #
    # Откуда 3m. PNG 1200x1200 без потерь, белый фон, векторная графика —
    # плотность у таких изображений низкая; base64 добавляет ровно треть
    # (4/3). Верхняя реалистичная граница payload'а — около 1.1 МБ, то есть
    # глобальный лимит в 1m стоит ровно на её краю, отсюда и отказы «через
    # раз». 3m покрывает эту границу с двойным запасом и переживёт рост
    # size с 1200 до 1600 (площадь x1.78). Больше не берём: у соседней
    # ручки со скриншотами стоит 6m при заявленных 5 МБ, и уходить за неё
    # ради картинки, которая должна быть в разы меньше, незачем.
    #
    # Регулярное выражение, а не префикс: id карты стоит В СЕРЕДИНЕ пути, и
    # префиксом «/api/v1/chart/.../pdf» не выразить. Regex-location меняет
    # порядок подбора: он проверяется раньше префиксных (второй такой блок в
    # конфиге — сессионные ручки /auth/ выше). Выражение заякорено с обоих концов
    # (^...$), поэтому перехватывает ровно один путь и ничего больше —
    # /api/ остаётся нетронутым для всех остальных ручек.
    location ~ ^/api/v1/chart/[^/]+/pdf$ {
        client_max_body_size 3m;
        limit_req zone=api burst=20 nodelay;

        include /etc/nginx/snippets/security-headers.conf;

        # Литерал 127.0.0.1 — по той же причине, что в /api/ ниже.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;

        include /etc/nginx/snippets/security-headers.conf;

        # Литерал 127.0.0.1 намеренный — не заменять на имя сервиса
        # (http://api:8000). Сеть astro_net поднята с enable_ipv6, резолв имени
        # может уйти в AAAA, и peer, который увидит приложение, станет
        # IPv6-шлюзом fd00:cafe:1::1. Его нет в TRUSTED_PROXY_IPS, поэтому
        # client_ip перестанет доверять X-Forwarded-For и вернёт сам шлюз —
        # тот не входит в подсети ЮKassa, и ВСЕ вебхуки начнут отбиваться 403:
        # деньги списываются, подписки не выдаются, в логах только ERROR.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Публичные страницы шаринга и PNG-карточки: рендер картинки 1080×1920 плюс
    # запрос к LLM за подписью на каждый новый токен.
    location /share/ {
        limit_req zone=share burst=10 nodelay;

        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Диагностика ──────────────────────────────────────────────────────────
    # /health отдаём наружу (Uptime Kuma опрашивает его через интернет), а
    # /health/db — только с локалхоста: даже без текста исключения сам факт
    # ответа "database: error" — бесплатная разведка состояния инфраструктуры.
    location = /health/db {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /health {
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # /metrics — Prometheus. Наружу отдавать нечего: там количество юзеров,
    # тарифы, расход на AI.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        allow 172.28.0.0/16;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
