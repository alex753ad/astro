# Uptime Kuma на отдельном поддомене, за TLS и basic-auth.
#
# Поддомен, а не путь вида /status/ на основном сайте: Uptime Kuma официально
# не поддерживает работу из-под подпути — ломаются абсолютные пути ассетов и
# WebSocket (Socket.IO) переподключение. Поддомен избегает этого класса багов
# ценой одной лишней DNS-записи.
#
# ── Что нужно сделать один раз перед установкой ──────────────────────────────
#   1. A-запись status.aristeatime.ru -> IP сервера.
#   2. Сертификат:  sudo certbot certonly --nginx -d status.aristeatime.ru
#      До выпуска сертификата этот файл nginx -t не пройдёт — поэтому
#      08-setup-automation.sh сам проверяет наличие сертификата и, если его
#      нет, ставит временный HTTP-вариант только под ACME-челлендж.
#   3. Сменить пароль:  sudo htpasswd -c /etc/nginx/.htpasswd-status <user>
#      Прежний пароль считать скомпрометированным: он ходил по открытому HTTP
#      в заголовке Authorization (base64, не шифрование) при каждом запросе.
#
# ── Ограничение по IP ────────────────────────────────────────────────────────
# Панель показывает внутреннюю топологию, адреса эндпоинтов и историю
# инцидентов — публичной ей быть незачем. Если у вас статический адрес,
# раскомментируйте allow/deny ниже; basic-auth останется вторым рубежом.
# Совсем надёжный вариант — убрать поддомен из DNS и ходить туннелем:
#   ssh -L 3001:127.0.0.1:3001 <user>@<server>   →  http://localhost:3001

server {
    listen 80;
    listen [::]:80;
    server_name status.astreatime.ru status.aristeatime.ru;

    # Обновление сертификата должно работать без TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.astreatime.ru status.aristeatime.ru;

    ssl_certificate     /etc/letsencrypt/live/status.astreatime.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.astreatime.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/status.astreatime.ru/chain.pem;
    # ssl_protocols / ssl_ciphers / ssl_session_* — conf.d/00-astro-hardening.conf

    location / {
        # allow 203.0.113.10;   # ваш статический IP
        # deny all;

        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd-status;

        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uptime Kuma держит живое соединение по WebSocket для обновления
        # статусов в реальном времени — без Upgrade/Connection оно не установится.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
